version: "0.1"

x-postgresql-database-config-data:
  &postgesql-connection-data
  environment:
    - SPRING_DATASOURCE_PLATFORM=postgresql
    - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
    - POSTGRES_USER=${POSTGRESQL_USERNAME}
    - POSTGRES_DB=ride_db

x-keycloak-config-data:
  &keycloak-connection-data
  environment:
    - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_USERNAME}
    - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
    - DB_VENDOR=postgresql
    - DB_ADDR=postgresql
    - DB_DATABASE=keycloak_db
    - DB_USER=${POSTGRESQL_USERNAME}
    - DB_PASSWORD=${POSTGRESQL_PASSWORD}

x-kafka-config-data:
  &kafka-connection-data
  environment:
    - KAFKA_CFG_NODE_ID=0
    - KAFKA_CFG_PROCESS_ROLES=controller,broker
    - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
    - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
    - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    - KAFKA_ENABLE_KRAFT=yes
    - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

x-config-eureka-server:
  &spring-config
  environment:
    - eureka.client.service-Url.defaultZone=http://eureka-server:8761/eureka

x-config-ride-microservice:
  &spring-postgres-ride-database-config
  environment:
    - spring.datasource.url=jdbc:postgresql://postgresql:5432/ride_db
    - eureka.client.service-Url.defaultZone=http://eureka-server:8761/eureka
    - spring.datasource.password=${POSTGRESQL_PASSWORD}
    - spring.datasource.username=${POSTGRESQL_USERNAME}

x-config-driver-microservice:
  &spring-postgres-driver-database-config
  environment:
    - spring.datasource.url=jdbc:postgresql://postgresql:5432/driver_db
    - eureka.client.service-Url.defaultZone=http://eureka-server:8761/eureka
    - spring.datasource.password=${POSTGRESQL_PASSWORD}
    - spring.datasource.username=${POSTGRESQL_USERNAME}

x-config-rating-microservice:
  &spring-postgres-rating-database-config
  environment:
    - spring.datasource.url=jdbc:postgresql://postgresql:5432/rating_db
    - eureka.client.service-Url.defaultZone=http://eureka-server:8761/eureka
    - spring.datasource.password=${POSTGRESQL_PASSWORD}
    - spring.datasource.username=${POSTGRESQL_USERNAME}

x-config-passenger-microservice:
  &spring-postgres-passenger-database-config
  environment:
    - spring.datasource.url=jdbc:postgresql://postgresql:5432/passenger_db
    - eureka.client.service-Url.defaultZone=http://eureka-server:8761/eureka
    - spring.datasource.password=${POSTGRESQL_PASSWORD}
    - spring.datasource.username=${POSTGRESQL_USERNAME}

services:

  postgresql:
    image: postgres:16
    env_file:
      - .env
    restart: always
    ports:
      - 5432:5432
    <<: *postgesql-connection-data
    container_name: postgresql
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: ./Dockerfile
    image: eurekaserver:v1.0
    env_file:
      - .env
    ports:
      - 8761:8761
    <<: *spring-config
    container_name: eureka-server
    networks:
      - app

  passenger-service:
    build:
      context: ./passenger-service
      dockerfile: ./Dockerfile
    image: passenger-service:v1.0
    env_file:
      - .env
    ports:
      - 8081:8081
    depends_on:
      - postgresql
      - eureka-server
      - kafka
      - logstash
    <<: *spring-postgres-passenger-database-config
    container_name: passenger_service
    networks:
      - app

  ride-service:
    build:
      context: ../ride-service
      dockerfile: ./Dockerfile
    image: ride-service:1
    env_file:
      - .env
    ports:
      - 8084:8084
    depends_on:
      - postgresql
      - eureka-server
      - logstash
    <<: *spring-postgres-ride-database-config
    container_name: ride_service
    networks:
      - app

  driver-service:
    build:
      context: ../driver-service
      dockerfile: ./Dockerfile
    image: driver-service:1
    env_file:
      - .env
    ports:
      - 8082:8082
    depends_on:
      - postgresql
      - eureka-server
      - kafka
      - logstash
    <<: *spring-postgres-driver-database-config
    container_name: driver-service
    networks:
      - app

  rating-service:
    build:
      context: ../rating-service
      dockerfile: ./Dockerfile
    image: rating-service:1
    env_file:
      - .env
    ports:
      - 8083:8083
    depends_on:
      - postgresql
      - eureka-server
      - kafka
      - ride-service
      - logstash
    <<: *spring-postgres-rating-database-config
    container_name: rating-service
    networks:
      - app

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ./Dockerfile
    image: api-gateway:v1.0
    <<: *spring-config
    container_name: api-gateway
    networks:
      - app
    depends_on:
      - eureka-server
    ports:
      - 8080:8080

  kafka:
    image: 'bitnami/kafka:3.7.0'
    container_name: kafka
    hostname: kafka
    ports:
      - 9092:9092
    <<: *kafka-connection-data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - app
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - xpack.security.enabled=false
    ports:
      - 9200:9200
    networks:
      - app

  kibana:
    image: kibana:8.15.0
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    networks:
      - app

  logstash:
    image: logstash:8.15.0
    container_name: logstash
    volumes:
      - ./monitoring/logstash:/usr/share/logstash/pipeline:ro
    ports:
      - 5000:5000
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - app

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: keycloak
    <<: *keycloak-connection-data
    command: ['start-dev',
              '--http-port=8100',
              '--import-realm']
    depends_on:
     - postgresql
    ports:
      - 8100:8100
    volumes:
      - ./keycloak:/opt/jboss/keycloak/realm-config
    networks:
      - app

  redis-master-sentinel:
    image: redis:latest
    container_name: redis-master-sentinel
    hostname: redis-master-sentinel
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6379:6379
    networks:
      - app

  redis-replica:
    image: redis:latest
    container_name: redis-replica
    command: [ "redis-server", "--replicaof", "redis-master-sentinel", "6379" ]
    depends_on:
      - redis-master-sentinel
    networks:
      - app

  sentinel:
    image: redis:latest
    container_name: sentinel
    volumes:
      - ./redis-sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    ports:
      - 26379:26379
    networks:
     - app

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
     - 5540:5540
    networks:
      - app

  redis-cluster-1:
    image: redis:latest
    command: ["redis-server", "--port", "6381", "--cluster-enabled", "yes", "--cluster-node-timeout", "2000" ,"--appendonly yes"]
    container_name: redis-cluster-1
    hostname: redis-cluster-1
    ports:
      - 6381:6381
    networks:
      - app

  redis-cluster-2:
    image: redis:latest
    command: ["redis-server", "--port", "6382", "--cluster-enabled", "yes", "--cluster-node-timeout", "2000" ,"--appendonly yes"]
    container_name: redis-cluster-2
    hostname: redis-cluster-2
    ports:
      - 6382:6382
    networks:
      - app

  redis-cluster-3:
    image: redis:latest
    command: ["redis-server", "--port", "6383", "--cluster-enabled", "yes", "--cluster-node-timeout", "2000" ,"--appendonly yes"]
    container_name: redis-cluster-3
    hostname: redis-cluster-3
    ports:
      - 6383:6383
    networks:
      - app

  redis-cluster:
    image: redis:latest
    container_name: redis-cluster
    command: ["redis-cli", "--cluster", "create" ,"redis-cluster-1:6381", "redis-cluster-2:6382", "redis-cluster-3:6383", "--cluster-replicas", "0", "--cluster-yes"]
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
    ports:
      - 6379:6379
    networks:
      - app

networks:
  app:
    name: cab-aggregation

volumes:
  postgres:
  kafka_data:
  elasticsearch_data:
    driver: local
