server:
  port: 8081
spring:
  application:
    name: passenger-service
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    bootstrap-servers: kafka:9092
    properties:
      retries: 3
      linger.ms: 1
      spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8100/realms/cab-aggregator-realm
          jwk-set-uri: http://localhost:8100/realms/cab-aggregator-realm/protocol/openid-connect/certs
  data:
    mongodb:
      uri: mongodb://localhost:27017/passenger_db
logging:
  level:
    org.springframework.security: DEBUG
    com.software.modsen.passengerservice.service: INFO
eureka:
  instance:
    hostname: passenger-service
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: prometheus
